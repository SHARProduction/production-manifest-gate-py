<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Production Manifest Gate | SHAR Production</title><link rel="canonical" href="https://sharproduction.github.io/production-manifest-gate-py/"><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#18202a}textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}button{background:#172a46;color:#fff;border:0;border-radius:6px;width:auto}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:6px}</style></head><body><h1>Production Manifest Gate</h1><p>SHAR Production is an AI-hybrid video production studio. Check rights-state fields before releasing a production manifest.</p><label>Manifest JSON <textarea id="data" rows="12">{"project":"Sample film","assets":[{"name":"main edit","rights_status":"cleared"},{"name":"music cue","rights_status":"unknown"}]}</textarea></label><button id="run">Run gate</button><pre id="output" aria-live="polite">Ready.</pre><p><a href="https://sharprod.com/">SHAR Production</a> · MIT</p><script>run.onclick=()=>{try{let x=JSON.parse(data.value),a=Array.isArray(x.assets)?x.assets:[],b=a.map((v,i)=>({asset:i+1,name:v.name||null,status:v.rights_status==='cleared'?'PASS':'BLOCK'}));output.textContent=JSON.stringify({project:x.project||null,assets:b,release_allowed:b.every(v=>v.status==='PASS')},null,2)}catch(e){output.textContent='Invalid JSON: '+e.message}}</script></body></html>
