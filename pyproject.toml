[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shar-production-manifest-gate"
version = "1.0.0"
description = "Rights-aware production manifest gate for Python pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SHAR Production"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video"
]

[project.urls]
Homepage = "https://sharprod.com/"
Repository = "https://github.com/SHARProduction/production-manifest-gate-py"

[project.scripts]
production-manifest-gate = "production_manifest_gate.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
